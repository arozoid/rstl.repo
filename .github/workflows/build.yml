name: Build Packages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 12 * * *'  # daily at UTC noon
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --user root
    steps:
      - name: Install deps
        run: pacman -Syu --noconfirm pacman-contrib git rust meson scdoc tllist xorgproto fcft libpulse systemd-libs libxcb libyaml pipewire pixman wayland wayland-protocols xcb-util xcb-util-cursor xcb-util-wm alsa-lib libinih polkit xdg-desktop-portal base-devel gtk-update-icon-cache

      - name: Add build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - uses: actions/checkout@v4

      - name: Build packages
        run: |
          mkdir -p repo
          declare -A built=()
          pending() {
            local dir pkg
            for dir in pkgbuilds/*/; do
              pkg=$(basename "$dir")
              [ -n "${built[$pkg]:-}" ] || return 1
            done
          }
          while ! pending; do
            progress=0
            for dir in pkgbuilds/*/; do
              pkg=$(basename "$dir")
              [ -n "${built[$pkg]:-}" ] && continue
              readarray -t deps < <(bash -c '. "$1/PKGBUILD"; printf "%s\n" "${depends[@]:-}" "${makedepends[@]:-}"' bash "$dir" | sed '/^$/d')
              defer_pkg=0
              if ! pacman -T "${deps[@]}" >/dev/null 2>&1; then
                # only defer if a missing dep is provided by another package in this repo;
                # anything else comes from the official repos and makepkg --syncdeps will fetch it
                for dep in "${deps[@]}"; do
                  name=${dep%%[<>=]*}
                  if [ -d "pkgbuilds/$name" ] && [ -z "${built[$name]:-}" ]; then
                    defer_pkg=1
                    break
                  fi
                done
              fi
              if [ "$defer_pkg" -eq 1 ]; then
                echo "::group::Deferring $pkg (waiting on repo packages)"
                echo "::endgroup::"
                continue
              fi
              echo "::group::Building $pkg"
              builddir="/tmp/build-$pkg"
              mkdir -p "$builddir"
              cp -a "$dir"/. "$builddir/"
              chown -R builder:builder "$builddir"
              if sudo -u builder bash -c "
                cd '$builddir'
                makepkg --syncdeps --noconfirm --nocheck --skipchecksums --skipinteg --skippgpcheck 2>&1
              "; then
                pacman -U --noconfirm --needed "$builddir"/*.pkg.tar.*
                mv "$builddir"/*.pkg.tar.* repo/
                built[$pkg]=1
                progress=1
              else
                echo "::error::$pkg failed to build"
                exit 1
              fi
              rm -rf "$builddir"
              echo "::endgroup::"
            done
            if [ "$progress" -eq 0 ]; then
              for dir in pkgbuilds/*/; do
                pkg=$(basename "$dir")
                [ -n "${built[$pkg]:-}" ] || echo "::error::$pkg has unresolved dependencies"
              done
              exit 1
            fi
          done

      - name: Create repo database
        run: |
          chown -R builder:builder repo
          sudo -u builder bash -c "
            cd repo
            repo-add rstl-repo.db.tar.gz *.pkg.tar.*
          "

      - name: Generate site
        run: |
          set -euo pipefail
          cd repo
          total=$(ls *.pkg.tar.* 2>/dev/null | wc -l)
          {
            echo '<!DOCTYPE html>'
            echo '<html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width,initial-scale=1">'
            echo '<title>rstl.repo — custom pacman repository</title>'
            echo '<style>body{font-family:system-ui,sans-serif;max-width:50rem;margin:2rem auto;padding:0 1rem;line-height:1.5}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:.4rem .6rem;border-bottom:1px solid #ddd}code{background:#f4f4f4;padding:.1rem .3rem;border-radius:3px}a{color:#2563eb;text-decoration:none}desc{color:#555}</style>'
            echo '</head><body>'
            echo '<h1>rstl.repo</h1>'
            echo "<p>custom pacman repository for the <a href=\"https://github.com/arozoid/rstl.sway/\">rstl.sway</a> rice — ${total} package(s)</p>"
            echo '<table><tr><th>package</th><th>arch</th><th>size</th></tr>'
            for pkgfile in *.pkg.tar.*; do
              [ -e "$pkgfile" ] || continue
              name=$(pacman -Qip "$pkgfile" | sed -n 's/^Name *: //p')
              ver=$(pacman -Qip "$pkgfile" | sed -n 's/^Version *: //p')
              arch=$(pacman -Qip "$pkgfile" | sed -n 's/^Architecture *: //p')
              desc=$(pacman -Qip "$pkgfile" | sed -n 's/^Description *: //p')
              size=$(du -h "$pkgfile" | cut -f1)
              printf '<tr><td><a href="%s.html">%s</a></td><td>%s</td><td>%s</td></tr>\n' "$name" "$name" "${arch:-?}" "$size"
              {
                echo '<!DOCTYPE html>'
                echo '<html lang="en"><head><meta charset="utf-8">'
                echo "<title>${name} — rstl.repo</title>"
                echo '<style>body{font-family:system-ui,sans-serif;max-width:50rem;margin:2rem auto;padding:0 1rem;line-height:1.5}code{background:#f4f4f4;padding:.1rem .3rem;border-radius:3px}a{color:#2563eb;text-decoration:none}ul{line-height:1.7}</style>'
                echo '</head><body>'
                echo '<p><a href="index.html">← rstl.repo</a></p>'
                echo "<h1>${name}</h1>"
                echo "<p class=\"desc\">${desc}</p>"
                echo "<p><code>${pkgfile}</code> — ${size}</p>"
                echo '<h2>files</h2><ul>'
                tar -tf "$pkgfile" | grep -v '/$' | while read -r f; do echo "<li><code>${f}</code></li>"; done
                echo '</ul></body></html>'
              } > "${name}.html"
            done
            printf '</table></body></html>\n'
          } > index.html
          ls -la

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: repo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
