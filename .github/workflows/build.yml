name: Build Packages

on:
  schedule:
    - cron: '0 0 * * 1'  # every monday at midnight
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --user root
    steps:
      - name: Install deps
        run: pacman -Syu --noconfirm pacman-contrib git rust meson scdoc tllist xorgproto fcft libpulse libudev libxcb libyaml pipewire pixman wayland wayland-protocols xcb-util xcb-util-cursor xcb-util-wm alsa-lib libinih base-devel

      - name: Add build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - uses: actions/checkout@v4

      - name: Build packages
        run: |
          mkdir -p repo
          for dir in pkgbuilds/*/; do
            pkg=$(basename "$dir")
            echo "::group::Building $pkg"
            sudo -u builder bash -c "
              cd '$dir'
              makepkg --noconfirm --nocheck --skipchecksums --skipinteg --skippgpcheck 2>&1
            "
            mv "$dir"*.pkg.tar.* repo/ 2>/dev/null || true
            echo "::endgroup::"
          done

      - name: Create repo database
        run: |
          sudo -u builder bash -c "
            cd repo
            repo-add rstl-repo.db.tar.gz *.pkg.tar.*
          "

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
