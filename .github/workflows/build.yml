name: Build Packages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 12 * * *'  # daily at UTC noon
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --user root
    steps:
      - name: Install deps
        run: pacman -Syu --noconfirm pacman-contrib git rust meson scdoc tllist xorgproto fcft libpulse systemd-libs libxcb libyaml pipewire pixman wayland wayland-protocols xcb-util xcb-util-cursor xcb-util-wm alsa-lib libinih polkit xdg-desktop-portal base-devel gtk-update-icon-cache

      - name: Add build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - uses: actions/checkout@v4

      - name: Build packages
        run: |
          mkdir -p repo
          declare -A built=()
          pending() {
            local dir pkg
            for dir in pkgbuilds/*/; do
              pkg=$(basename "$dir")
              [ -n "${built[$pkg]:-}" ] || return 1
            done
          }
          while ! pending; do
            progress=0
            for dir in pkgbuilds/*/; do
              pkg=$(basename "$dir")
              [ -n "${built[$pkg]:-}" ] && continue
              readarray -t deps < <(bash -c '. "$1/PKGBUILD"; printf "%s\n" "${depends[@]:-}" "${makedepends[@]:-}"' bash "$dir" | sed '/^$/d')
              if [ "${#deps[@]}" -gt 0 ] && ! pacman -T "${deps[@]}" >/dev/null 2>&1; then
                echo "::group::Deferring $pkg (dependencies not installed yet)"
                echo "::endgroup::"
                continue
              fi
              echo "::group::Building $pkg"
              builddir="/tmp/build-$pkg"
              mkdir -p "$builddir"
              cp -a "$dir"/. "$builddir/"
              chown -R builder:builder "$builddir"
              if sudo -u builder bash -c "
                cd '$builddir'
                makepkg --noconfirm --nocheck --skipchecksums --skipinteg --skippgpcheck 2>&1
              "; then
                pacman -U --noconfirm --needed "$builddir"/*.pkg.tar.*
                mv "$builddir"/*.pkg.tar.* repo/
                built[$pkg]=1
                progress=1
              else
                echo "::error::$pkg failed to build"
                exit 1
              fi
              rm -rf "$builddir"
              echo "::endgroup::"
            done
            if [ "$progress" -eq 0 ]; then
              for dir in pkgbuilds/*/; do
                pkg=$(basename "$dir")
                [ -n "${built[$pkg]:-}" ] || echo "::error::$pkg has unresolved dependencies"
              done
              exit 1
            fi
          done

      - name: Create repo database
        run: |
          chown -R builder:builder repo
          sudo -u builder bash -c "
            cd repo
            repo-add rstl-repo.db.tar.gz *.pkg.tar.*
          "

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
